<div class="login-page">
  <div class="login-card">
    <h1>SmartGate</h1>
    <p>Prijava korisnika</p>

    <input
      type="text"
      name="username"
      placeholder="Korisničko ime"
      [(ngModel)]="user.username"
    />

    <input
      type="password"
      name="password"
      placeholder="Lozinka"
      [(ngModel)]="user.password"
    />

    @if (update) {
      <button (click)="updateUser()">Promeni sifru</button>

    } @else{
      <button (click)="login()">Uloguj se</button>

    }
  </div>
</div>
